# Netlifyの設定。index.html をそのまま公開し、netlify/functions の中身を「関数」として動かします。
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# 関数のソースや設定ファイルが、そのままサイトから見えてしまわないようにする
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
