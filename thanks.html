<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送信しました｜TSUYU「細かすぎる」エンタメ研究所</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#faf8f4; --ink:#22201d; --muted:#6b665e; --line:#e3ded4; --accent:#b4442b; --accent-ink:#fff; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --ink:#efebe3; --muted:#a39d92; --line:#35322d; --accent:#e0765c; --accent-ink:#1b1a18; --card:#24221f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; line-height:1.95; font-size:16px; -webkit-text-size-adjust:100%; }
  .sans { font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif; }
  a { color:var(--accent); text-underline-offset:3px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 20px; }
  header.site { border-bottom:1px solid var(--line); font-size:14px; }
  header.site .wrap { display:flex; align-items:center; min-height:56px; max-width:920px; }
  .brand { font-weight:700; color:var(--ink); text-decoration:none; letter-spacing:.03em; }
  main { padding:40px 0 56px; }
  h1 { font-size:24px; margin:0 0 20px; letter-spacing:.04em; }
  h2 { font-size:17px; margin:34px 0 8px; }
  p, ul, ol { margin:0 0 1em; } ul, ol { padding-left:1.4em; }
  dl.contact { margin:12px 0 0; padding:16px 20px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  dl.contact div { display:flex; gap:12px; padding:4px 0; } dl.contact dt { flex:none; width:7.5em; color:var(--muted); } dl.contact dd { margin:0; min-width:0; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:14px; margin-top:28px; }
  .btn { display:inline-block; padding:12px 26px; border:1px solid var(--accent); border-radius:999px; background:var(--accent); color:var(--accent-ink); text-decoration:none; font-weight:700; font-size:15px; }
  footer { border-top:1px solid var(--line); padding:24px 0 40px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header class="site sans"><div class="wrap"><a class="brand" href="./">「細かすぎる」エンタメ研究所　所長 TSUYU</a></div></header>
<main><div class="wrap">
<h1>送信しました</h1>
<p>お問い合わせありがとうございます。内容を確認のうえ、ご入力いただいたメールアドレスへご連絡します。</p>
<p class="sans" style="margin-top:28px"><a class="btn" href="./">トップページへ戻る</a></p>
</div></main>
<footer><div class="wrap sans">© 2026 津山雄輔（TSUYU）</div></footer>
</body>
</html>
